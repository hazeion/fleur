name: Native prerequisite setup
on:
  pull_request:
  workflow_dispatch:
    inputs:
      reference_proof:
        description: Run the full three-run production reference workload on an observed native runner
        required: false
        default: false
        type: boolean
      debian_helpers:
        description: Exact recorded amd64 helper pair as compact base64 JSON; empty runs ordinary native checks
        required: false
        default: ""
        type: string
      debian_recovery:
        description: Run the fixed Debian interrupted-recovery case; requires debian_helpers
        required: false
        default: false
        type: boolean
      arch_boot_observation:
        description: Run the fixed read-only Arch KVM boot observation; no installation qualification
        required: false
        default: false
        type: boolean
      workout_proof:
        description: Run the fixed native Debian packed workout/production proof after all setup and isolation gates; requires debian_helpers
        required: false
        default: false
        type: boolean
      desktop_runtime_images:
        description: Prepare source-bound Intel Desktop qualification images on disposable native Linux; no runtime admission
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
# Retire superseded PR work; retain every main-branch verification run.
# Workflow and event namespaces prevent cross-workflow or PR/push cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  scope:
    name: CI change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.selection.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checksum-pinned Bun for CI policy checks
        run: |
          python3 experiments/compatibility/platforms/bootstrap.py --system Linux --architecture x86_64 --ubuntu 24.04 --out "$RUNNER_TEMP/fleur-ci-policy-bun"
          echo "$RUNNER_TEMP/fleur-ci-policy-bun" >> "$GITHUB_PATH"
      - name: Verify CI selection and workflow wiring
        run: bun test tests/ci
      - name: Inspect complete change scope
        id: selection
        run: bun scripts/ci-scope.ts

  existing-docker:
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.debian_helpers != '' || inputs.debian_recovery || inputs.arch_boot_observation || inputs.desktop_runtime_images || inputs.workout_proof) && matrix.architecture == 'x86_64' && 40 || 10 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
      - name: Native identity and checksum-pinned Bun
        run: |
          python3 experiments/compatibility/platforms/bootstrap.py --system Linux --architecture '${{ matrix.architecture }}' --ubuntu 24.04 --out "$RUNNER_TEMP/fleur-native-bun" > "$RUNNER_TEMP/fleur-native-platform.json"
          echo "$RUNNER_TEMP/fleur-native-bun" >> "$GITHUB_PATH"
      - name: Read-only native runner package and service inventory
        timeout-minutes: 2
        env:
          FLEUR_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          FLEUR_OBSERVATION_RUNNER: ${{ matrix.runner }}
        run: bun scripts/observe-native-runner.ts --observe > "$RUNNER_TEMP/fleur-native-runner-inventory.json"
      - name: Observe fixed KVM device without creating a VM
        timeout-minutes: 1
        run: |
          python3 -I scripts/observe-native-virtualization.py > "$RUNNER_TEMP/fleur-virtualization-user.json"
          if timeout 10s sudo -n /usr/bin/python3 -I scripts/observe-native-virtualization.py > "$RUNNER_TEMP/fleur-virtualization-root.json"; then
            :
          else
            status=$?
            printf '{"formatVersion":1,"scope":"native-runner-virtualization-observation","nativeQualification":false,"vmCreated":false,"kvmUsable":"unproven","rootTransport":"unavailable","exitCode":%d}\n' "$status" > "$RUNNER_TEMP/fleur-virtualization-root.json"
          fi
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Packed doctor and owned Docker smoke twice
        env:
          FLEUR_OWNED_DISPOSABLE_HOST: "yes"
          FLEUR_NATIVE_REPORT: ${{ runner.temp }}/fleur-native-setup.json
        run: bun scripts/verify-native-setup.ts
      - name: Read the immutable workout source pin
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.workout_proof && matrix.architecture == 'x86_64' }}
        id: workout
        run: |
          python3 -c 'import json,re; p=json.load(open("scripts/workout-source.json")); assert p["repository"]=="hazeion/fleur-workout" and re.fullmatch("[a-f0-9]{40}",p["commit"]); print("sha="+p["commit"])' >> "$GITHUB_OUTPUT"
      - name: Read-only private workout source for native Debian
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.workout_proof && matrix.architecture == 'x86_64' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          repository: hazeion/fleur-workout
          ref: ${{ steps.workout.outputs.sha }}
          path: workout-source
          ssh-key: ${{ secrets.FLEUR_WORKOUT_READ_KEY }}
          persist-credentials: false
      - name: Fresh Debian 13 native KVM qualification
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.debian_helpers != '' || inputs.debian_recovery || inputs.workout_proof) && matrix.architecture == 'x86_64' }}
        timeout-minutes: 38
        env:
          FLEUR_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          FLEUR_PINNED_BUN: ${{ runner.temp }}/fleur-native-bun/bun
        run: python3 -I scripts/qualify-debian-kvm.py --run > "$RUNNER_TEMP/fleur-debian13-kvm.json"
      - name: Read-only Arch native KVM boot observation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.arch_boot_observation && matrix.architecture == 'x86_64' }}
        timeout-minutes: 38
        env:
          FLEUR_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          FLEUR_PINNED_BUN: ${{ runner.temp }}/fleur-native-bun/bun
        run: python3 -I scripts/qualify-debian-kvm.py --run > "$RUNNER_TEMP/fleur-arch-kvm-boot.json"
      - name: Prepare native Desktop runtime image inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop_runtime_images && matrix.architecture == 'x86_64' }}
        timeout-minutes: 20
        run: python3 experiments/compatibility/desktop-runtime/export_images.py --output "$RUNNER_TEMP/fleur-desktop-images"
      - name: Preserve native observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: native-setup-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/fleur-native-platform.json
            ${{ runner.temp }}/fleur-native-runner-inventory.json
            ${{ runner.temp }}/fleur-debian13-kvm.json
            ${{ runner.temp }}/fleur-arch-kvm-boot.json
            ${{ runner.temp }}/fleur-native-setup.json
            ${{ runner.temp }}/fleur-desktop-images/
            ${{ runner.temp }}/fleur-virtualization-user.json
            ${{ runner.temp }}/fleur-virtualization-root.json
          if-no-files-found: error
          retention-days: 7

  reference-proof:
    name: Reference proof selection
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: fleur
    steps:
      - name: Reference proof selection
        working-directory: ${{ runner.temp }}
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_proof }}
        run: |
          if [ "$REQUESTED" = true ]; then
            mkdir -m 700 "$RUNNER_TEMP/fleur-reference-tmp"
            printf 'TMPDIR=%s\n' "$RUNNER_TEMP/fleur-reference-tmp" >> "$GITHUB_ENV"
          else
            echo 'Reference proof not requested; this run supplies no performance qualification.'
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_proof }}
        with:
          path: fleur
          persist-credentials: false
      - name: Read the reviewed immutable workout source pin
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_proof }}
        id: workout
        run: |
          python3 -c 'import json,re; p=json.load(open("scripts/workout-source.json")); assert p["repository"]=="hazeion/fleur-workout" and re.fullmatch("[a-f0-9]{40}",p["commit"]); print("sha="+p["commit"])' >> "$GITHUB_OUTPUT"
      - name: Read-only private workout checkout
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_proof }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          repository: hazeion/fleur-workout
          ref: ${{ steps.workout.outputs.sha }}
          path: workout
          ssh-key: ${{ secrets.FLEUR_WORKOUT_READ_KEY }}
          persist-credentials: false
      - name: Native identity and checksum-pinned Bun
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_proof }}
        run: |
          python3 experiments/compatibility/platforms/bootstrap.py --system Linux --architecture x86_64 --ubuntu 24.04 --out "$RUNNER_TEMP/fleur-workout-bun" > "$RUNNER_TEMP/workout-platform.json"
          echo "$RUNNER_TEMP/fleur-workout-bun" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile --ignore-scripts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_proof }}
      - run: bun install --cwd lint --frozen-lockfile --ignore-scripts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_proof }}
      - name: Explicit browser prerequisites
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_proof }}
        run: bun ./node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Pinned development images
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_proof }}
        run: bun scripts/pull-pinned-development-images.ts
      - name: Packed workout, two independent views and clean production restart
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_proof }}
        run: bun scripts/verify-workout.ts "$GITHUB_WORKSPACE/workout" --reference > "$RUNNER_TEMP/workout-proof.json"
      - name: Retain sanitized qualification evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.reference_proof }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: workout-reference
          path: |
            ${{ runner.temp }}/workout-platform.json
            ${{ runner.temp }}/workout-proof.json
            fleur/test-results/workout-reference.json
          retention-days: 7


  verification:
    name: Native setup verification
    if: ${{ always() }}
    needs: ["scope", "existing-docker", "reference-proof"]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
      - name: Checksum-pinned Bun for verification summary
        run: |
          python3 experiments/compatibility/platforms/bootstrap.py --system Linux --architecture x86_64 --ubuntu 24.04 --out "$RUNNER_TEMP/fleur-ci-summary-bun"
          echo "$RUNNER_TEMP/fleur-ci-summary-bun" >> "$GITHUB_PATH"
      - name: Require scope and every applicable check to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bun scripts/ci-scope.ts --check-results
