name: CLI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  packed-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Native identity and checksum-pinned Bun
        run: |
          python3 experiments/compatibility/platforms/bootstrap.py --system Linux --architecture x86_64 --ubuntu 24.04 --out "$RUNNER_TEMP/fleur-cli-bun" > "$RUNNER_TEMP/fleur-cli-platform.json"
          echo "$RUNNER_TEMP/fleur-cli-bun" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun install --cwd lint --frozen-lockfile --ignore-scripts
      - run: bun test tests/cli
      - run: bun run types
      - run: bun run lint
      - name: Fresh generated project tooling, first isolated run
        run: bun scripts/verify-generated-project.ts
      - name: Fresh generated project tooling, second isolated run
        run: bun scripts/verify-generated-project.ts
