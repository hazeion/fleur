name: CLI
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
# Retire superseded PR work; retain every main-branch verification run.
# Workflow and event namespaces prevent cross-workflow or PR/push cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  scope:
    name: CI change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.selection.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checksum-pinned Bun for CI policy checks
        run: |
          python3 experiments/compatibility/platforms/bootstrap.py --system Linux --architecture x86_64 --ubuntu 24.04 --out "$RUNNER_TEMP/fleur-ci-policy-bun"
          echo "$RUNNER_TEMP/fleur-ci-policy-bun" >> "$GITHUB_PATH"
      - name: Verify CI selection and workflow wiring
        run: bun test tests/ci
      - name: Inspect complete change scope
        id: selection
        run: bun scripts/ci-scope.ts

  packed-cli:
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
      - name: Native identity and checksum-pinned Bun
        run: |
          python3 experiments/compatibility/platforms/bootstrap.py --system Linux --architecture x86_64 --ubuntu 24.04 --out "$RUNNER_TEMP/fleur-cli-bun" > "$RUNNER_TEMP/fleur-cli-platform.json"
          echo "$RUNNER_TEMP/fleur-cli-bun" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun install --cwd lint --frozen-lockfile --ignore-scripts
      - run: bun test tests/cli
      - run: bun run types
      - run: bun run lint
      - name: Fresh generated project tooling, first isolated run
        run: bun scripts/verify-generated-project.ts
      - name: Fresh generated project tooling, second isolated run
        run: bun scripts/verify-generated-project.ts
  desktop-placement-fixtures:
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
      - name: Native Darwin identity and checksum-pinned Bun
        run: |
          python3 experiments/compatibility/platforms/bootstrap.py --system Darwin --architecture '${{ matrix.architecture }}' --out "$RUNNER_TEMP/fleur-desktop-fixture-bun" > "$RUNNER_TEMP/fleur-desktop-fixture-platform.json"
          echo "$RUNNER_TEMP/fleur-desktop-fixture-bun" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Real atomic filesystem placement with simulated Desktop host commands
        run: bun test tests/cli/setup-desktop.test.ts

  verification:
    name: CLI verification
    if: ${{ always() }}
    needs: ["scope", "packed-cli", "desktop-placement-fixtures"]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
      - name: Checksum-pinned Bun for verification summary
        run: |
          python3 experiments/compatibility/platforms/bootstrap.py --system Linux --architecture x86_64 --ubuntu 24.04 --out "$RUNNER_TEMP/fleur-ci-summary-bun"
          echo "$RUNNER_TEMP/fleur-ci-summary-bun" >> "$GITHUB_PATH"
      - name: Require scope and every applicable check to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bun scripts/ci-scope.ts --check-results
