name: Observer cleanup diagnosis
on:
  push:
    branches: [fix/observer-cleanup-110]
permissions:
  contents: read
concurrency:
  group: observer-cleanup-diagnosis-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, machine: x86_64}
          - {runner: ubuntu-24.04-arm, machine: aarch64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native identity
        run: |
          test "$(uname -m)" = '${{ matrix.machine }}'
          uname -srm
          python3 --version
      - name: Trace original observer cleanup requirements
        run: python3 -B experiments/compatibility/runtime-probe/diagnose_observer_cleanup.py > observer-cleanup-diagnostic.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: observer-cleanup-diagnostic-${{ matrix.machine }}
          path: observer-cleanup-diagnostic.json
          retention-days: 7
